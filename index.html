<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualFlow Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DF</div>
        <div>
          <h1>DualFlow</h1>
          <p>Team Project Board</p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="board">▦ Board</button>
        <button class="nav-btn" data-view="projects">▣ Projects</button>
      </nav>

      <div class="sidebar-section">
        <p class="section-label">TEAM</p>
        <div id="teamList"></div>
      </div>

      <div class="sidebar-footer">
        <button id="resetDemo" class="ghost-btn full">Reset demo data</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Project Board</h2>
          <p id="todayText"></p>
        </div>
        <div class="topbar-actions">
          <select id="currentUserSelect" class="select"></select>
          <button id="newProjectBtn" class="secondary-btn">+ Project</button>
          <button id="newTaskBtn" class="primary-btn">+ Add Card</button>
        </div>
      </header>

      <section id="boardView" class="view active">
        <div class="board-header">
          <div class="board-title-row">
            <div>
              <h3>Team Board</h3>
              <p>Drag cards between lists to update their status.</p>
            </div>
            <div id="boardStats" class="board-stats"></div>
          </div>

          <div class="toolbar">
            <input id="taskSearch" type="search" placeholder="Search cards..." />
            <select id="filterProject" class="select"></select>
            <select id="filterAssignee" class="select"></select>
            <select id="filterPriority" class="select">
              <option value="">All priorities</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>
        </div>

        <div id="kanbanBoard" class="kanban-board"></div>
      </section>

      <section id="projectsView" class="view">
        <div class="section-heading">
          <div>
            <h3>Projects</h3>
            <p>Manage projects and view progress.</p>
          </div>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="taskDialog">
    <form id="taskForm" class="modal-form">
      <div class="modal-header">
        <div>
          <span id="taskStatusTop" class="status-kicker">TO DO</span>
          <h3 id="taskModalTitle">New Card</h3>
          <p>Add details to this task card.</p>
        </div>
        <button type="button" class="icon-btn" data-close="taskDialog">×</button>
      </div>

      <input type="hidden" id="taskId" />

      <label>
        Card title
        <input id="taskName" required maxlength="120" placeholder="e.g. Prepare client report" />
      </label>

      <div class="form-grid">
        <label>
          Project
          <select id="taskProject" required></select>
        </label>
        <label>
          Assignee
          <select id="taskAssignee" required></select>
        </label>
      </div>

      <div class="form-grid">
        <label>
          List / Status
          <select id="taskStatus">
            <option>To Do</option>
            <option>In Progress</option>
            <option>Review</option>
            <option>Done</option>
          </select>
        </label>
        <label>
          Priority
          <select id="taskPriority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
        </label>
      </div>

      <label>
        Due date
        <input id="taskDue" type="date" />
      </label>

      <label>
        Description
        <textarea id="taskNotes" rows="5" placeholder="Add notes, instructions, links, or details..."></textarea>
      </label>

      <label>
        Checklist items
        <textarea id="taskChecklist" rows="4" placeholder="One item per line&#10;Example:&#10;Review copy&#10;Check mobile view"></textarea>
        <span class="helper">Enter one checklist item per line.</span>
      </label>

      <div class="modal-actions">
        <button type="button" id="deleteTaskBtn" class="danger-btn hidden">Delete Card</button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" data-close="taskDialog">Cancel</button>
        <button type="submit" class="primary-btn">Save Card</button>
      </div>
    </form>
  </dialog>

  <dialog id="projectDialog">
    <form id="projectForm" class="modal-form">
      <div class="modal-header">
        <div>
          <h3 id="projectModalTitle">New Project</h3>
          <p>Create a project for your two-person team.</p>
        </div>
        <button type="button" class="icon-btn" data-close="projectDialog">×</button>
      </div>

      <input type="hidden" id="projectId" />

      <label>
        Project name
        <input id="projectName" required maxlength="100" />
      </label>

      <label>
        Description
        <textarea id="projectDescription" rows="4"></textarea>
      </label>

      <label>
        Due date
        <input id="projectDue" type="date" />
      </label>

      <div class="modal-actions">
        <button type="button" id="deleteProjectBtn" class="danger-btn hidden">Delete Project</button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" data-close="projectDialog">Cancel</button>
        <button type="submit" class="primary-btn">Save Project</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
